<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Resonance Lattice</title>

<style>
body {
    background: radial-gradient(circle at center, #3a2a12 0%, #120a03 70%);
    color: #ffd36a;
    font-family: "Courier New", monospace;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    overflow: hidden;
}

h1 {
    letter-spacing: 3px;
    color: #ffcc66;
    text-shadow: 0 0 8px #6a4a18;
}

#strain, #pressureLabel {
    margin-bottom: 6px;
    font-size: 14px;
}

#pressureBar {
    width: 320px;
    height: 10px;
    border: 1px solid #cfa44a;
    background: #2b1a08;
    margin-bottom: 10px;
}

#pressureFill {
    height: 100%;
    width: 0%;
    background: linear-gradient(to right, #ffcc66, #ff6644);
}

.grid {
    display: grid;
    grid-template-columns: repeat(3, 110px);
    grid-template-rows: repeat(3, 110px);
    gap: 12px;
}

.rune {
    position: relative;
    background: radial-gradient(circle at top left, #5a3c1a, #241406);
    border: 2px solid #cfa44a;
    border-radius: 10px;
    box-shadow: inset 0 0 15px rgba(0,0,0,0.8);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
}

.center {
    cursor: default;
    background: radial-gradient(circle, #7a5522, #2d1b07);
}

.locked {
    border-color: #ffdd66;
    box-shadow: 0 0 14px rgba(255,220,120,0.6);
}

.arrow {
    width: 70%;
    height: 70%;
    object-fit: contain;
    transition: transform 0.25s;
}

.symbol {
    position: absolute;
    bottom: 6px;
    right: 6px;
    font-size: 14px;
    opacity: 0.6;
}

.active {
    box-shadow: 0 0 25px rgba(255,220,120,0.8);
}

button {
    margin-top: 10px;
    background: #2b1a08;
    color: #ffd36a;
    border: 1px solid #cfa44a;
    padding: 6px 18px;
    cursor: pointer;
}

button:hover {
    background: #3b260c;
}

#log {
    margin-top: 12px;
    width: 340px;
    min-height: 40px;
    text-align: center;
}
canvas {
    position: fixed;
    top: 0;
    left: 0;
    pointer-events: none;
}
</style>
</head>

<body>

<canvas id="dust"></canvas>

<h1>RESONANCE LATTICE</h1>
<div id="strain">Mental Strain: 0 / 5</div>

<div id="pressureLabel">Overseer Pressure</div>
<div id="pressureBar"><div id="pressureFill"></div></div>

<div class="grid" id="grid"></div>

<button onclick="useForce()">Channel the Force</button>

<div id="log">Sand drifts through the silent chamber.</div>

<script>
/* ---------- GAME STATE ---------- */
const rotations = [0, 90, 180, 270]; // LEFT, DOWN, RIGHT, UP
let level = 1;
let strain = 0;
let pressure = 0;
const maxStrain = 5;
const maxPressure = 100;

const symbols = ["⟁","⌖","⟡","⌁","⍜","⎔","⟢","⟁"];
let runes = [];
let forceRuneIndex;
let activeRunes = [];

const grid = document.getElementById("grid");
const log = document.getElementById("log");
const strainDiv = document.getElementById("strain");
const pressureFill = document.getElementById("pressureFill");

/* ---------- LEVEL SETUP ---------- */
function setupLevel() {
    grid.innerHTML = "";
    runes = [];
    activeRunes = [];

    // Increase difficulty
    const activeCount = Math.min(3 + level, 8);

    while (activeRunes.length < activeCount) {
        const idx = Math.floor(Math.random() * 9);
        if (idx !== 4 && !activeRunes.includes(idx)) {
            activeRunes.push(idx);
        }
    }

    forceRuneIndex = activeRunes[Math.floor(Math.random() * activeRunes.length)];

    for (let i = 0; i < 9; i++) {
        const div = document.createElement("div");
        div.classList.add("rune");

        if (i === 4) {
            div.classList.add("center");
            div.innerHTML = `<div class="symbol">◉</div>`;
        } else if (activeRunes.includes(i)) {
            const rot = Math.floor(Math.random() * 4);
            runes[i] = rot;

            const img = document.createElement("img");
            img.src = "arrow.png";
            img.classList.add("arrow");
            img.style.transform = `rotate(${rotations[rot]}deg)`;

            const sym = document.createElement("div");
            sym.classList.add("symbol");
            sym.textContent = symbols[i % symbols.length];

            div.appendChild(img);
            div.appendChild(sym);

            if (i === forceRuneIndex) div.classList.add("locked");

            div.onclick = () => rotateRune(i);
        }

        grid.appendChild(div);
    }

    log.textContent = `Lattice depth increases. Level ${level}`;
}

/* ---------- INTERACTION ---------- */
function rotateRune(i) {
    if (i === forceRuneIndex) {
        log.textContent = "The rune resists physical touch.";
        return;
    }
    runes[i] = (runes[i] + 1) % 4;
    updateArrow(i);
    checkWin();
}

function useForce() {
    strain++;
    pressure += 8;
    updateBars();

    if (strain >= maxStrain || pressure >= maxPressure) {
        log.textContent = "Your mind fractures. Footsteps echo above.";
        grid.style.opacity = "0.3";
        return;
    }

    runes[forceRuneIndex] = (runes[forceRuneIndex] + 1) % 4;
    updateArrow(forceRuneIndex);

    log.textContent = "Stone vibrates as the rune yields.";
    checkWin();
}

function updateArrow(i) {
    const arrow = grid.children[i].querySelector(".arrow");
    arrow.style.transform = `rotate(${rotations[runes[i]]}deg)`;
}

/* ---------- WIN CONDITION ---------- */
function checkWin() {
    for (let i of activeRunes) {
        if (runes[i] !== 2) return; // all must point RIGHT (toward center)
    }

    log.textContent = "Resonance achieved. The lattice descends.";
    grid.querySelectorAll(".rune").forEach(r => r.classList.add("active"));

    setTimeout(() => {
        level++;
        setupLevel();
    }, 1500);
}

/* ---------- PRESSURE TICK ---------- */
setInterval(() => {
    pressure += 1;
    updateBars();
    if (pressure >= maxPressure) {
        log.textContent = "The overseers arrive. The chamber seals.";
    }
}, 1000);

function updateBars() {
    strainDiv.textContent = `Mental Strain: ${strain} / ${maxStrain}`;
    pressureFill.style.width = `${pressure}%`;
}

/* ---------- DUST PARTICLES ---------- */
const canvas = document.getElementById("dust");
const ctx = canvas.getContext("2d");
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

const dust = Array.from({ length: 120 }, () => ({
    x: Math.random() * canvas.width,
    y: Math.random() * canvas.height,
    r: Math.random() * 2 + 0.5,
    s: Math.random() * 0.3 + 0.1
}));

function drawDust() {
    ctx.clearRect(0,0,canvas.width,canvas.height);
    ctx.fillStyle = "rgba(255,220,150,0.15)";
    dust.forEach(p => {
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fill();
        p.y += p.s;
        if (p.y > canvas.height) p.y = 0;
    });
    requestAnimationFrame(drawDust);
}

drawDust();
setupLevel();
</script>

</body>
</html>
