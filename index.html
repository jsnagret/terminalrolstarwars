<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Resonance Lattice</title>

<style>
body {
    background:
        radial-gradient(circle at center, #3a2a12 0%, #140c04 70%);
    color: #ffd36a;
    font-family: "Courier New", monospace;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
}

h1 {
    letter-spacing: 3px;
    color: #ffcc55;
    text-shadow: 0 0 8px #664400;
}

#strain {
    margin-bottom: 12px;
    color: #ff9966;
}

.grid {
    display: grid;
    grid-template-columns: repeat(3, 110px);
    grid-template-rows: repeat(3, 110px);
    gap: 12px;
}

.rune {
    position: relative;
    background:
        radial-gradient(circle at top left, #5a3c1a, #2b1a08);
    border: 2px solid #cfa44a;
    border-radius: 10px;
    box-shadow:
        inset 0 0 15px rgba(0,0,0,0.8),
        0 0 10px rgba(255,200,80,0.15);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
}

.rune:hover {
    box-shadow: 0 0 15px rgba(255,210,120,0.4);
}

.center {
    cursor: default;
    background:
        radial-gradient(circle, #7a5522, #2d1b07);
}

.locked {
    border-color: #ffdd66;
    box-shadow: 0 0 12px rgba(255,220,120,0.6);
}

.symbol {
    position: absolute;
    bottom: 6px;
    right: 6px;
    font-size: 14px;
    opacity: 0.6;
}

.arrow {
    width: 25px;
    height: 25px;
    transition: transform 0.25s;
}

.active {
    box-shadow: 0 0 25px rgba(255,220,120,0.8);
}

#log {
    margin-top: 15px;
    width: 340px;
    text-align: center;
    min-height: 40px;
    color: #ffcc88;
}

button {
    margin-top: 10px;
    background: #2b1a08;
    color: #ffd36a;
    border: 1px solid #cfa44a;
    padding: 6px 18px;
    cursor: pointer;
}

button:hover {
    background: #3b260c;
}
</style>
</head>

<body>

<h1>RESONANCE LATTICE</h1>
<div id="strain">Mental Strain: 0 / 5</div>

<div class="grid" id="grid"></div>

<button onclick="useForce()">Channel the Force</button>

<div id="log">Dust coats the ancient mechanism.</div>

<script>
const rotations = [0, 90, 180, 270];
let strain = 0;
const maxStrain = 5;

// Required rotations pointing inward
const required = {
    0: 180,
    1: 180,
    2: 180,
    3: 90,
    5: 270,
    6: 0,
    7: 0,
    8: 0
};

// Ancient-looking symbols
const symbols = ["⟁","⌖","⟡","⌁","⍜","⎔","⟢","⟁"];

let runes = [];
const forceRuneIndex = Math.floor(Math.random() * 8);
if (forceRuneIndex >= 4) forceRuneIndex++;

const grid = document.getElementById("grid");
const log = document.getElementById("log");
const strainDiv = document.getElementById("strain");

function createRunes() {
    for (let i = 0; i < 9; i++) {
        const div = document.createElement("div");
        div.classList.add("rune");

        if (i === 4) {
            div.classList.add("center");
            div.innerHTML = `<span class="symbol">◉</span>`;
        } else {
            const rotIndex = Math.floor(Math.random() * 4);
            runes[i] = rotIndex;

            const img = document.createElement("img");
            img.src = "arrow.png";
            img.classList.add("arrow");
            img.style.transform = `rotate(${rotations[rotIndex]}deg)`;

            const sym = document.createElement("div");
            sym.classList.add("symbol");
            sym.textContent = symbols[i % symbols.length];

            div.appendChild(img);
            div.appendChild(sym);

            if (i === forceRuneIndex) {
                div.classList.add("locked");
            }

            div.onclick = () => rotateRune(i);
        }

        grid.appendChild(div);
    }
}

function rotateRune(i) {
    if (i === forceRuneIndex) {
        log.textContent = "The rune refuses logic. It hums softly.";
        return;
    }
    runes[i] = (runes[i] + 1) % 4;
    grid.children[i].querySelector(".arrow")
        .style.transform = `rotate(${rotations[runes[i]]}deg)`;
    checkWin();
}

function useForce() {
    strain++;
    strainDiv.textContent = `Mental Strain: ${strain} / ${maxStrain}`;

    if (strain >= maxStrain) {
        log.textContent =
            "Pain fractures your thoughts. Sand fills the chamber.";
        grid.style.opacity = "0.3";
        return;
    }

    runes[forceRuneIndex] = (runes[forceRuneIndex] + 1) % 4;
    grid.children[forceRuneIndex].querySelector(".arrow")
        .style.transform = `rotate(${rotations[runes[forceRuneIndex]]}deg)`;

    log.textContent = "The locked rune yields… reluctantly.";
    checkWin();
}

function checkWin() {
    for (let i in required) {
        if (rotations[runes[i]] !== required[i]) return;
    }

    log.textContent =
        "The lattice aligns. Stone grinds open beneath the sand.";
    grid.querySelectorAll(".rune").forEach(r => r.classList.add("active"));
}

createRunes();
</script>

</body>
</html>
