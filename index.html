<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Proto-TIE Unauthorized Launch</title>
<style>
html, body {
    margin: 0;
    background: #000;
    height: 100%;
    overflow: hidden;
    font-family: monospace;
    color: #dcdcdc;
}

#screen {
    width: 100vw;
    height: 100vh;
    position: relative;
    background: radial-gradient(circle at center, #111 0%, #000 70%);
}

/* HUD */
.hud {
    position: absolute;
    inset: 20px;
    border: 2px solid #555;
    box-shadow: inset 0 0 40px rgba(255,255,255,0.05);
}

.label {
    color: #ff4444;
    font-size: 12px;
    letter-spacing: 2px;
}

/* Meters */
.meter {
    width: 20px;
    height: 200px;
    border: 1px solid #777;
    position: absolute;
    bottom: 40px;
}

.fill {
    position: absolute;
    bottom: 0;
    width: 100%;
    background: linear-gradient(#ffcc66, #aa5500);
}

/* Sand overlay */
#sand {
    position: absolute;
    inset: 0;
    pointer-events: none;
    background-image:
        radial-gradient(circle, rgba(255,200,100,0.04) 1px, transparent 1px);
    background-size: 4px 4px;
    opacity: 0.4;
    animation: drift 20s linear infinite;
}

@keyframes drift {
    from { background-position: 0 0; }
    to { background-position: 400px 200px; }
}

/* Warnings */
#warning {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    color: #ff3333;
    font-size: 18px;
    text-align: center;
    opacity: 0;
}

/* Enemies */
.enemy {
    position: absolute;
    width: 30px;
    height: 10px;
    background: red;
    top: 30%;
}

</style>
</head>
<body>

<div id="screen">
    <div class="hud">
        <div class="label" style="top:10px;left:10px;position:absolute">
            PILOT AUTH: FAILED<br>
            MANUAL OVERRIDE ACTIVE
        </div>

        <div class="meter" style="left:40px">
            <div id="throttleFill" class="fill"></div>
        </div>
        <div class="label" style="left:38px;bottom:10px;position:absolute">
            ION
        </div>

        <div class="meter" style="right:40px">
            <div id="stabilityFill" class="fill"></div>
        </div>
        <div class="label" style="right:28px;bottom:10px;position:absolute">
            STAB
        </div>

        <div id="warning">INSTABILITY</div>
    </div>

    <div id="sand"></div>
</div>

<script>
let throttle = 0;
let stability = 50;
let altitude = 0;
let phase = "boot";
let enemies = [];

const throttleFill = document.getElementById("throttleFill");
const stabilityFill = document.getElementById("stabilityFill");
const warning = document.getElementById("warning");
const screen = document.getElementById("screen");

/* BOOT */
setTimeout(() => phase = "lift", 3000);

document.addEventListener("keydown", e => {
    if (phase === "lift") {
        if (e.key === "w") throttle += 2;
        if (e.key === "s") throttle -= 2;
        if (e.key === "a") stability -= 3;
        if (e.key === "d") stability += 3;
    }

    if (phase === "combat" && e.code === "Space") {
        fire();
    }
});

function update() {
    throttle = Math.max(0, Math.min(100, throttle));
    stability = Math.max(0, Math.min(100, stability));

    throttleFill.style.height = throttle * 2 + "px";
    stabilityFill.style.height = stability * 2 + "px";

    if (phase === "lift") {
        const wobble = Math.abs(stability - 50);

        altitude += throttle * 0.02 - wobble * 0.05;

        if (wobble > 20) {
            warning.style.opacity = 1;
        } else {
            warning.style.opacity = 0;
        }

        if (altitude > 100) {
            startCombat();
        }

        if (altitude < -20) {
            reset();
        }
    }

    requestAnimationFrame(update);
}

function startCombat() {
    phase = "combat";
    warning.innerText = "CONTACT";
    warning.style.opacity = 1;

    for (let i = 0; i < 3; i++) {
        const e = document.createElement("div");
        e.className = "enemy";
        e.style.left = Math.random() * window.innerWidth + "px";
        e.style.top = (30 + i * 10) + "%";
        screen.appendChild(e);
        enemies.push(e);
    }
}

function fire() {
    if (enemies.length > 0) {
        const e = enemies.pop();
        e.remove();
        if (enemies.length === 0) {
            warning.innerText = "AIRSPACE CLEAR";
        }
    }
}

function reset() {
    throttle = 0;
    altitude = 0;
    warning.innerText = "CRASH";
    warning.style.opacity = 1;
}

update();
</script>

</body>
</html>
