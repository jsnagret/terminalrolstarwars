<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Ancient Flow Mechanism</title>

<style>
html, body {
    margin: 0;
    height: 100%;
    background: radial-gradient(circle at center, #2b1a0a 0%, #120a05 70%);
    overflow: hidden;
    font-family: monospace;
}

#cave {
    position: relative;
    width: 100%;
    height: 100%;
    background:
        radial-gradient(circle at 30% 40%, rgba(255,140,40,0.08), transparent 40%),
        radial-gradient(circle at 70% 60%, rgba(255,110,20,0.06), transparent 45%);
}

/* Stone runes */
.rune {
    width: 80px;
    height: 80px;
    background:
        radial-gradient(circle at 30% 30%, #7a3f16, #3a1d0b);
    border-radius: 12px;
    box-shadow:
        inset 0 0 10px rgba(0,0,0,0.8),
        0 0 12px rgba(255,120,40,0.15);
    position: absolute;
    cursor: pointer;
}

/* Center receptor */
#core {
    width: 120px;
    height: 120px;
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    background:
        radial-gradient(circle, #2a1405 40%, #120800 70%);
    box-shadow: inset 0 0 20px rgba(0,0,0,0.9);
}

#core.active {
    background:
        radial-gradient(circle, #ffcc66 20%, #b36a12 60%, #3a1d0b 75%);
    box-shadow:
        0 0 30px rgba(255,180,60,0.8),
        inset 0 0 20px rgba(0,0,0,0.6);
}

canvas {
    width: 100%;
    height: 100%;
    pointer-events: none;
}

/* UI */
#ui {
    position: absolute;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    text-align: center;
}

button {
    background: linear-gradient(#7a3f16, #3a1d0b);
    color: #ffd28a;
    border: none;
    padding: 12px 24px;
    font-size: 16px;
    border-radius: 8px;
    cursor: pointer;
    box-shadow: 0 0 12px rgba(255,150,60,0.4);
}
</style>
</head>

<body>
<div id="cave">
    <div id="core"></div>
    <div id="ui">
        <button onclick="channelForce()">Channel the Force</button>
    </div>
</div>

<script>
const cave = document.getElementById("cave");
const core = document.getElementById("core");

let level = 1;
let flowing = false;
let runes = [];

function createRune(x, y) {
    const rune = document.createElement("div");
    rune.className = "rune";
    rune.style.left = x + "px";
    rune.style.top = y + "px";

    const canvas = document.createElement("canvas");
    canvas.width = 80;
    canvas.height = 80;
    rune.appendChild(canvas);

    const ctx = canvas.getContext("2d");
    let rotation = Math.floor(Math.random() * 4) * 90;
    let offset = 0;

    rune.style.transform = `rotate(${rotation}deg)`;

    rune.onclick = () => {
        if (!flowing) {
            rotation += 90;
            rune.style.transform = `rotate(${rotation}deg)`;
        }
    };

    function draw() {
        ctx.clearRect(0, 0, 80, 80);

        if (!flowing) return;

        ctx.strokeStyle = "rgba(255,200,90,0.9)";
        ctx.lineWidth = 6;
        ctx.lineCap = "round";

        ctx.beginPath();
        for (let y = -20; y < 100; y += 10) {
            const wave = Math.sin((y + offset) * 0.15) * 4;
            ctx.lineTo(40 + wave, y);
        }
        ctx.stroke();

        offset += 1;
        requestAnimationFrame(draw);
    }

    draw();

    runes.push({ rune, rotation, canvas });
    cave.appendChild(rune);
}

function setupLevel() {
    runes.forEach(r => r.rune.remove());
    runes = [];
    flowing = false;
    core.classList.remove("active");

    const centerX = window.innerWidth / 2;
    const centerY = window.innerHeight / 2;

    for (let i = 0; i < level + 2; i++) {
        const angle = (Math.PI * 2 / (level + 2)) * i;
        const radius = 180 + level * 40;
        const x = centerX + Math.cos(angle) * radius - 40;
        const y = centerY + Math.sin(angle) * radius - 40;
        createRune(x, y);
    }
}

function channelForce() {
    flowing = true;

    setTimeout(checkWin, 2500);
}

function checkWin() {
    // Simple logic: all runes must be vertical (0 or 180)
    const aligned = runes.every(r =>
        Math.abs(r.rune.style.transform.replace(/[^0-9]/g, "") % 180) === 0
    );

    if (aligned) {
        core.classList.add("active");
        setTimeout(() => {
            level++;
            setupLevel();
        }, 1500);
    } else {
        flowing = false;
    }
}

setupLevel();
</script>
</body>
</html>
