<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Ancient Flow Rune</title>

<style>
body {
    margin: 0;
    background: radial-gradient(circle, #2c1a0b, #120900);
    height: 100vh;
    overflow: hidden;
}

#board {
    position: absolute;
    inset: 0;
}

.rune {
    position: absolute;
    width: 80px;
    height: 80px;
    background: radial-gradient(circle at 30% 30%, #8a4a1c, #3a1d0b);
    border-radius: 10px;
    box-shadow: inset 0 0 12px rgba(0,0,0,.8);
    cursor: pointer;
}

canvas {
    width: 100%;
    height: 100%;
}

#core {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 120px;
    height: 120px;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    background: radial-gradient(circle, #1a0c05, #000);
    box-shadow: inset 0 0 25px rgba(0,0,0,.9);
}

#core.active {
    background: radial-gradient(circle, #ffd27a, #a85c12);
    box-shadow: 0 0 30px rgba(255,180,80,.9);
}

button {
    position: absolute;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    background: #5a2d10;
    color: #ffdca0;
    border: none;
    padding: 12px 22px;
    font-size: 16px;
    border-radius: 8px;
}
</style>
</head>

<body>
<div id="board"></div>
<div id="core"></div>
<button onclick="channelForce()">Channel the Force</button>

<script>
const board = document.getElementById("board");
const core = document.getElementById("core");

let flowing = false;
let runes = [];

function createRune(x, y) {
    const rune = document.createElement("div");
    rune.className = "rune";
    rune.style.left = x + "px";
    rune.style.top = y + "px";

    const canvas = document.createElement("canvas");
    canvas.width = 80;
    canvas.height = 80;
    rune.appendChild(canvas);

    const ctx = canvas.getContext("2d");
    let rotation = 0;
    let flow = 0;

    rune.onclick = () => {
        if (!flowing) {
            rotation = (rotation + 90) % 360;
            rune.style.transform = `rotate(${rotation}deg)`;
        }
    };

    function draw() {
        ctx.clearRect(0,0,80,80);

        // channel
        ctx.strokeStyle = "#4a250c";
        ctx.lineWidth = 12;
        ctx.lineCap = "round";
        ctx.beginPath();
        ctx.moveTo(40, 0);
        ctx.lineTo(40, 80);
        ctx.stroke();

        if (flowing) {
            ctx.strokeStyle = "rgba(255,200,90,.9)";
            ctx.lineWidth = 6;
            ctx.beginPath();
            ctx.moveTo(40, flow - 20);
            ctx.lineTo(40, flow + 20);
            ctx.stroke();

            flow += 2;
            if (flow > 100) flow = -20;
        }

        requestAnimationFrame(draw);
    }

    draw();

    runes.push({ rune, rotation });
    board.appendChild(rune);
}

function channelForce() {
    flowing = true;

    setTimeout(() => {
        const aligned = runes.every(r =>
            r.rune.style.transform.includes("0deg") ||
            r.rune.style.transform.includes("180deg")
        );

        if (aligned) {
            core.classList.add("active");
        } else {
            flowing = false;
        }
    }, 2000);
}

// layout
const cx = innerWidth / 2;
const cy = innerHeight / 2;

createRune(cx - 200, cy - 40);
createRune(cx + 120, cy - 40);
</script>
</body>
</html>
