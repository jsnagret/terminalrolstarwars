<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Resonance Lattice</title>

<style>
body {
    margin: 0;
    background: radial-gradient(circle at center, #3a2a12 0%, #120a03 70%);
    color: #ffd36a;
    font-family: "Courier New", monospace;
    overflow: hidden;
}

#ui {
    position: absolute;
    top: 20px;
    left: 50%;
    transform: translateX(-50%);
    text-align: center;
    z-index: 10;
}

h1 {
    letter-spacing: 3px;
    margin-bottom: 8px;
    text-shadow: 0 0 10px #6a4a18;
}

#strain, #pressureLabel {
    font-size: 14px;
}

#pressureBar {
    width: 320px;
    height: 10px;
    border: 1px solid #cfa44a;
    background: #2b1a08;
    margin: 6px auto;
}

#pressureFill {
    height: 100%;
    width: 0%;
    background: linear-gradient(to right, #ffcc66, #ff6644);
}

.grid {
    position: absolute;
    top: 55%;
    left: 50%;
    transform: translate(-50%, -50%);
    display: grid;
    grid-template-columns: repeat(3, 110px);
    grid-template-rows: repeat(3, 110px);
    gap: 12px;
    z-index: 5;
}

.rune {
    background: radial-gradient(circle at top left, #5a3c1a, #241406);
    border: 2px solid #cfa44a;
    border-radius: 10px;
    box-shadow: inset 0 0 15px rgba(0,0,0,0.8);
    position: relative;
    cursor: pointer;
}

.rune.locked {
    border-color: #ffdd66;
    box-shadow: 0 0 14px rgba(255,220,120,0.7);
}

.center {
    cursor: default;
    background: radial-gradient(circle, #7a5522, #2d1b07);
}

canvas.flow {
    width: 100%;
    height: 100%;
}

#log {
    position: absolute;
    bottom: 30px;
    width: 100%;
    text-align: center;
    color: #ffcc88;
}

button {
    margin-top: 8px;
    background: #2b1a08;
    color: #ffd36a;
    border: 1px solid #cfa44a;
    padding: 6px 18px;
    cursor: pointer;
}

canvas#dust {
    position: fixed;
    top: 0;
    left: 0;
    pointer-events: none;
}
</style>
</head>

<body>

<canvas id="dust"></canvas>

<div id="ui">
    <h1>RESONANCE LATTICE</h1>
    <div id="strain">Mental Strain: 0 / 5</div>
    <div id="pressureLabel">Overseer Pressure</div>
    <div id="pressureBar"><div id="pressureFill"></div></div>
    <button onclick="useForce()">Channel the Force</button>
</div>

<div class="grid" id="grid"></div>

<div id="log">Golden residue sleeps within the stone.</div>

<script>
/* ===================== GAME STATE ===================== */
const rotations = [0, 90, 180, 270]; // LEFT, DOWN, RIGHT, UP
let runes = [];
let flowCanvases = [];
let lockedRunes = [];
let level = 1;
let strain = 0;
let pressure = 0;

const maxStrain = 5;
const maxPressure = 100;

const grid = document.getElementById("grid");
const log = document.getElementById("log");
const strainDiv = document.getElementById("strain");
const pressureFill = document.getElementById("pressureFill");

/* ===================== SETUP ===================== */
function setupLevel() {
    grid.innerHTML = "";
    runes = [];
    flowCanvases = [];
    lockedRunes = [];

    const lockedCount = Math.min(level, 3);

    while (lockedRunes.length < lockedCount) {
        const i = Math.floor(Math.random() * 9);
        if (i !== 4 && !lockedRunes.includes(i)) lockedRunes.push(i);
    }

    for (let i = 0; i < 9; i++) {
        const div = document.createElement("div");
        div.classList.add("rune");

        if (i === 4) {
            div.classList.add("center");
        } else {
            runes[i] = Math.floor(Math.random() * 4);

            const canvas = document.createElement("canvas");
            canvas.width = 100;
            canvas.height = 100;
            canvas.classList.add("flow");
            canvas.style.transform = `rotate(${rotations[runes[i]]}deg)`;

            div.appendChild(canvas);
            flowCanvases[i] = canvas;

            if (lockedRunes.includes(i)) {
                div.classList.add("locked");
            }

            div.onclick = () => rotateRune(i);
            startFlow(canvas, i);
        }

        grid.appendChild(div);
    }

    log.textContent = `The lattice hums deeper. Layer ${level}.`;
}

/* ===================== FLOW ANIMATION ===================== */
function startFlow(canvas, index) {
    const ctx = canvas.getContext("2d");
    let offset = 0;

    function draw() {
        ctx.clearRect(0,0,100,100);

        // liquid
        ctx.strokeStyle = lockedRunes.includes(index)
            ? "rgba(255,180,80,0.4)"
            : "rgba(255,215,120,0.9)";
        ctx.lineWidth = 8;
        ctx.lineCap = "round";

        ctx.beginPath();
        for (let y = -20; y < 120; y += 8) {
            const wave = Math.sin((y + offset) * 0.12) * 6;
            ctx.lineTo(50 + wave, y);
        }
        ctx.stroke();

        offset += lockedRunes.includes(index) ? 0.3 : 1.2;
        requestAnimationFrame(draw);
    }
    draw();
}

/* ===================== INTERACTION ===================== */
function rotateRune(i) {
    if (lockedRunes.includes(i)) {
        log.textContent = "The liquid refuses to flow.";
        return;
    }
    runes[i] = (runes[i] + 1) % 4;
    flowCanvases[i].style.transform =
        `rotate(${rotations[runes[i]]}deg)`;
    checkWin();
}

function useForce() {
    strain++;
    pressure += 8;
    updateBars();

    if (strain >= maxStrain || pressure >= maxPressure) {
        log.textContent = "Your mind fractures. Footsteps above.";
        grid.style.opacity = "0.3";
        return;
    }

    const target = lockedRunes[Math.floor(Math.random() * lockedRunes.length)];
    runes[target] = (runes[target] + 1) % 4;
    flowCanvases[target].style.transform =
        `rotate(${rotations[runes[target]]}deg)`;

    log.textContent = "The liquid surges under your will.";
    checkWin();
}

/* ===================== WIN CONDITION ===================== */
function checkWin() {
    for (let i = 0; i < 9; i++) {
        if (i === 4) continue;
        if (runes[i] !== 2) return; // all flow toward center
    }

    log.textContent =
        "Resonance achieved. Stone descends beneath the sand.";
    level++;
    pressure = 0;
    strain = Math.max(0, strain - 1);

    setTimeout(setupLevel, 1500);
}

/* ===================== PRESSURE ===================== */
setInterval(() => {
    pressure++;
    updateBars();
    if (pressure >= maxPressure) {
        log.textContent = "Overseers breach the chamber.";
    }
}, 1000);

function updateBars() {
    strainDiv.textContent = `Mental Strain: ${strain} / ${maxStrain}`;
    pressureFill.style.width = `${pressure}%`;
}

/* ===================== DUST ===================== */
const dustCanvas = document.getElementById("dust");
const dctx = dustCanvas.getContext("2d");
dustCanvas.width = window.innerWidth;
dustCanvas.height = window.innerHeight;

const dust = Array.from({ length: 140 }, () => ({
    x: Math.random() * dustCanvas.width,
    y: Math.random() * dustCanvas.height,
    r: Math.random() * 2 + 0.5,
    s: Math.random() * 0.3 + 0.1
}));

function drawDust() {
    dctx.clearRect(0,0,dustCanvas.width,dustCanvas.height);
    dctx.fillStyle = "rgba(255,220,150,0.15)";
    dust.forEach(p => {
        dctx.beginPath();
        dctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        dctx.fill();
        p.y += p.s;
        if (p.y > dustCanvas.height) p.y = 0;
    });
    requestAnimationFrame(drawDust);
}

/* ===================== START ===================== */
drawDust();
setupLevel();
</script>

</body>
</html>
